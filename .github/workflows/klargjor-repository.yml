name: Klargjor Optituning-repository

on:
  push:
    branches:
      - optituning-jobbstyring
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: klargjor-optituning-repository
  cancel-in-progress: false

jobs:
  unpack:
    name: Pakk ut appfilene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hent repository
        uses: actions/checkout@v4
        with:
          ref: optituning-jobbstyring
          fetch-depth: 0

      - name: Pakk ut og flytt appen til repository-roten
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Optituning_Jobbstyring_Klar_til_Push.zip"
          SOURCE_DIR=".tmp-optituning/Optituning_Klar_til_GitHub_Push/optituning-jobbstyring"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ZIP-filen er allerede fjernet. Ingen endringer er nodvendige."
            exit 0
          fi

          rm -rf .tmp-optituning
          mkdir -p .tmp-optituning
          unzip -q "$ZIP_FILE" -d .tmp-optituning

          if [[ ! -d "$SOURCE_DIR" ]]; then
            echo "Fant ikke forventet prosjektmappe i ZIP-filen."
            find .tmp-optituning -maxdepth 4 -type d -print
            exit 1
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/klargjor-repository.yml' \
            "$SOURCE_DIR/" ./

          # Repositoryets eksisterende standardgren heter optituning-jobbstyring.
          # La deploy-workflowen reagere bade pa denne og main dersom grenen endres senere.
          if [[ -f .github/workflows/deploy-cloudflare.yml ]]; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-cloudflare.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    branches:\n      - main\n',
              '    branches:\n      - main\n      - optituning-jobbstyring\n'
          )
          text = text.replace('uses: actions/checkout@v6', 'uses: actions/checkout@v4')
          text = text.replace('uses: actions/setup-node@v6', 'uses: actions/setup-node@v4')
          path.write_text(text, encoding='utf-8')
          PY
          fi

          rm -f "$ZIP_FILE"
          rm -rf .tmp-optituning

      - name: Kontroller at kjernefilene finnes
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f wrangler.jsonc
          test -f src/worker.js
          test -f public/index.html
          test -f public/app.js
          test -f public/styles.css
          test -f migrations/0001_initial.sql
          test -f .github/workflows/deploy-cloudflare.yml

      - name: Commit og push appfilene
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "Ingen endringer a lagre."
            exit 0
          fi

          git config user.name "Optituning publiseringsbot"
          git config user.email "dalenholding@outlook.com"
          git add -A
          git commit -m "Pakk ut Optituning jobbstyring"
          git push origin HEAD:optituning-jobbstyring
